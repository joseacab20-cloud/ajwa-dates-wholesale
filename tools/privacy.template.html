<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
{{TRACKING_HEAD}}
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{PV_TITLE}}</title>
  <meta name="description" content="{{PV_DESCRIPTION}}">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#1b110b">
  <link rel="canonical" href="{{CANONICAL}}">
{{HREFLANG}}
  <link rel="icon" href="{{P}}favicon.ico" sizes="48x48">
  <link rel="icon" href="{{P}}favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="{{P}}icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="{{P}}apple-touch-icon.png">
  <link rel="manifest" href="{{P}}site.webmanifest">
  <link rel="stylesheet" href="{{P}}css/style.css?v=20261028c">
</head>
<body class="page-legal">
  {{ICON_SPRITE}}
  <a class="skip" href="#main">{{a11y.skip}}</a>

  <header class="header" id="top">
    <div class="container header__inner">
      <a class="brand" href="{{HOME_URL}}" aria-label="{{a11y.home}}">
        <img src="{{P}}favicon.svg" alt="" width="36" height="36">
        <span class="brand__txt">{{site.nameA}} <em>{{site.nameB}}</em></span>
      </a>
      <div class="header__actions">
        <a class="btn btn--wa btn--sm header__wa" href="{{WA}}" target="_blank" rel="noopener" data-cta="whatsapp" data-cta-location="header">{{ICON_WA}}<span>{{nav.cta}}</span></a>
      </div>
    </div>
  </header>

  <main id="main" class="legal">
    <div class="container container--narrow">
      <h1>{{PV_H1}}</h1>
      <p class="legal__updated">{{PV_UPDATED}}</p>
{{PV_BODY}}
      <p class="legal__back"><a class="btn btn--outline" href="{{HOME_URL}}">{{PV_BACK}}</a></p>
    </div>
  </main>

  <footer class="footer footer--legal">
    <div class="container footer__bottom">
      <p>© <span id="year">2026</span> {{site.name}} — {{footer.rights}}</p>
      <p class="legal-links"><a href="./" aria-current="page">{{footer.privacy}}</a> · <button type="button" class="link-btn" data-consent-open>{{footer.cookies}}</button></p>
    </div>
  </footer>

  <script src="{{P}}js/main.js?v=20261028c" defer></script>
  <script src="{{P}}js/analytics.js?v=20261028c" defer></script>
</body>
</html>
